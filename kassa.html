<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kassa – Alpin</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#12263a">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="index.html" class="logo">Alpin</a>
      <nav class="menu" aria-label="Huvudmeny">
        <a href="index.html">Hem</a>
        <a href="skidmarken.html">Märkena</a>
        <a href="varmal.html">Vårt mål</a>
        <a href="kontakt.html">Kontakt</a>
      </nav>
      <a href="kassa.html" class="cart-link" aria-label="Varukorg" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 3H2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>
        <span class="cart-count" data-cart-count hidden>0</span>
      </a>
    </div>
  </header>

  <main class="wrap checkout">
    <h1>Kassa</h1>

    <div class="checkout-grid">
      <div>
        <!-- Varukorg -->
        <section class="card" aria-labelledby="cart-title">
          <h2 id="cart-title">Din varukorg</h2>
          <div id="cart-items"></div>

          <div class="ship-progress" id="ship-progress"></div>

          <dl class="totals" id="totals"></dl>
        </section>

        <!-- Tillägg -->
        <section class="card" id="upsell-section" style="margin-top:16px" aria-labelledby="upsell-title">
          <h2 id="upsell-title">Passar bra till</h2>
          <div class="upsell-list" id="upsells"></div>
        </section>
      </div>

      <!-- Uppgifter och betalning -->
      <form class="card checkout-form" id="checkout-form" novalidate>
        <div class="form-step">
          <h2>1. Kontaktuppgifter</h2>
          <div class="field">
            <label for="email">E-post</label>
            <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required>
          </div>
          <div class="field">
            <label for="phone">Mobilnummer</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" required>
          </div>
        </div>

        <div class="form-step">
          <h2>2. Leveransadress</h2>
          <div class="row-2">
            <div class="field">
              <label for="fname">Förnamn</label>
              <input id="fname" name="fname" autocomplete="given-name" required>
            </div>
            <div class="field">
              <label for="lname">Efternamn</label>
              <input id="lname" name="lname" autocomplete="family-name" required>
            </div>
          </div>
          <div class="field">
            <label for="address">Gatuadress</label>
            <input id="address" name="address" autocomplete="street-address" required>
          </div>
          <div class="row-zip">
            <div class="field">
              <label for="zip">Postnummer</label>
              <input id="zip" name="zip" autocomplete="postal-code" inputmode="numeric" pattern="[0-9 ]{5,6}" required>
            </div>
            <div class="field">
              <label for="city">Ort</label>
              <input id="city" name="city" autocomplete="address-level2" required>
            </div>
          </div>
        </div>

        <div class="form-step">
          <h2>3. Betalning</h2>
          <fieldset class="pay-options">
            <legend class="visually-hidden">Välj betalsätt</legend>
            <label class="pay-option">
              <input type="radio" name="payment" value="card" checked>
              <span class="pay-option-body"><strong>Kort</strong><span>Visa eller Mastercard</span></span>
              <span class="pay-badges"><span class="pay pay-visa">VISA</span><span class="pay pay-mc"></span></span>
            </label>
            <label class="pay-option">
              <input type="radio" name="payment" value="swish">
              <span class="pay-option-body"><strong>Swish</strong><span>Betala direkt i mobilen</span></span>
              <span class="pay-badges"><span class="pay pay-swish">Swish</span></span>
            </label>
            <label class="pay-option">
              <input type="radio" name="payment" value="klarna">
              <span class="pay-option-body"><strong>Klarna</strong><span>Betala senare eller dela upp</span></span>
              <span class="pay-badges"><span class="pay pay-klarna">Klarna</span></span>
            </label>
          </fieldset>

          <button type="submit" class="btn btn-primary btn-block" id="pay-btn">Betala <span data-total>0 kr</span></button>
          <p class="secure-note">Inget konto behövs · 14 dagars ångerrätt</p>

          <div class="notice" id="checkout-msg" role="status" hidden></div>
        </div>
      </form>
    </div>
  </main>

  <script src="shop.js"></script>
  <script src="kassa.js"></script>
</body>
</html>
